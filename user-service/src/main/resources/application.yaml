spring:
  application:
    name: user-service
# [분산 추적] spring.zipkin.* / spring.sleuth.* 는 Boot 3 에서 인식되지 않는다.
# 설정이 management.* 아래로 옮겨갔다. (아래 management 블록 참고)
#   spring.zipkin.base-url          -> management.zipkin.tracing.endpoint
#   spring.sleuth.sampler.probability -> management.tracing.sampling.probability
#  podman run -d -p 5672:5672 -p 15672:15672 --name rabbitmq rabbitmq:4.2.7-management # 주의: 4.3.x 버전을 사용하면 호환성 에러발생
  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: 5672
    username: guest
    password: guest
#  # bootstrap.yaml 쓰기 싫으면 아래 2줄 추가해서 대체 가능
#  config:
#    import: "optional:configserver:http://localhost:8888"

# native-repo/user-service.yml 로 내용을 옮김
#  h2:
#    console:
#      enabled: true
#      settings:
#        web-allow-others: true
#      path: /h2-console
#  datasource:
#    driver-class-name: org.h2.Driver
#    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;
#    username: sa
#    password:
  jpa:
    hibernate:
      ddl-auto: update
  # [주의] 아래 security.user 는 현재 "안 쓰이는 잔재"다.
  # 이건 Spring Boot 가 제공하는 기본 계정(default user) 설정인데,
  # WebSecurity.java 에서 DB 기반 커스텀 UserDetailsService(UserServiceImpl)를
  # 직접 꽂는 순간 Spring Boot 의 기본 계정 자동생성이 꺼진다(back off).
  # => 실제 로그인은 이 user/password 가 아니라, 회원가입(POST /users)으로
  #    DB 에 저장된 사용자를 email + password 로 인증한다.
  # 강의 초반 시큐리티 실습(HTTP Basic) 흔적이며, 지금은 지워도 무방.
  security:
    user:
      name: user
       # password: 평문 -> password
      password: $2a$10$Niu.iMKxv4JAGqvmKvksRuQUM96Gx3f/hyCI05Ny2mDj22imH9ANS
server:
  port: 0
eureka:
  instance:
    instance-id: ${spring.application.name}:${spring.application.instance_id:${random.value}}
    # [IDE] 지정하지 않으면 PC 의 LAN IP(예: 172.30.1.18)로 등록된다 -> gateway 가 LAN IP 로 호출
    #       -> user-service 가 보는 출발지 IP 도 LAN IP -> 와이파이가 바뀔 때마다 WebSecurity 에서 거부(401).
    #       localhost 로 등록하면 gateway 가 localhost 로 호출 -> 출발지 IP 가 항상 127.0.0.1.
    #       (전제: gateway 와 user-service 가 같은 PC 에서 돈다)
    # [컨테이너] prefer-ip-address=true 면 hostname 대신 IP 로 등록되므로 이 값은 무시된다.
    hostname: localhost
    # [컨테이너] 컨테이너 hostname(=컨테이너 ID) 대신 IP 로 등록해야 다른 컨테이너가 찾아올 수 있다
    prefer-ip-address: ${EUREKA_PREFER_IP_ADDRESS:false}
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://127.0.0.1:8761/eureka}

# WebSecurity 가 허용하는 gateway IP (쉼표 구분).
# [IDE] 기본값 127.0.0.1, ::1 / [컨테이너] compose 가 gateway 고정 IP(172.18.0.100)를 넘긴다
# 코드에 IP 를 직접 적어도 동작하지만, IP 가 바뀌어도 재빌드 없이 환경변수만 바꾸려고 설정으로 뺐다.
gateway:
  allowed-ips: "${GATEWAY_ALLOWED_IPS:127.0.0.1,::1}"

greeting:
  message: Welcome to the Simple E-commerce (spring boot)

#token:
#  secret: my-very-long-secret-key-1234567890123456
#  expiration-time: 86400000 # 10 day

management:
  endpoints:
    web:
      exposure:
        include:
          - refresh
          - health
          - beans
          - info
          - busrefresh
#          - busenv
          - info
          - metrics
          - prometheus

  # [분산 추적] 예전 spring.sleuth.sampler.probability 자리.
  # 수집할 요청의 비율. 1.0 = 전부 수집(실습용), 운영은 0.1 정도로 낮춘다.
  tracing:
    sampling:
      probability: 1.0

  # [분산 추적] 예전 spring.zipkin.base-url 자리.
  # 주의: base-url 과 달리 /api/v2/spans 경로까지 전부 적어야 한다.
  # (docker run -d -p 9411:9411 --name zipkin openzipkin/zipkin:3)
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://127.0.0.1:9411/api/v2/spans}


logging:
  # Sleuth 가 자동으로 해주던 일. Boot 3 에서는 직접 패턴을 지정해야
  # 로그에 [서비스명,traceId,spanId] 가 찍힌다.
  pattern:
    correlation: "[${spring.application.name:},%X{traceId:-},%X{spanId:-}] "
  level:
    org.springframework.security: DEBUG
    com.example.userservice.client: DEBUG