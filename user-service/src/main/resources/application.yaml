spring:
  application:
    name: user-service
#  podman run -d -p 5672:5672 -p 15672:15672 --name rabbitmq rabbitmq:4.2.7-management # 주의: 4.3.x 버전을 사용하면 호환성 에러발생
  rabbitmq:
    host: 127.0.0.1
    port: 5672
    username: guest
    password: guest
#  # bootstrap.yaml 쓰기 싫으면 아래 2줄 추가해서 대체 가능
#  config:
#    import: "optional:configserver:http://localhost:8888"
  h2:
    console:
      enabled: true
      settings:
        web-allow-others: true
      path: /h2-console
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
  security:
    user:
      name: user
       # password: 평문 -> password
      password: $2a$10$Niu.iMKxv4JAGqvmKvksRuQUM96Gx3f/hyCI05Ny2mDj22imH9ANS
server:
  port: 0
eureka:
  instance:
    instance-id: ${spring.application.name}:${spring.application.instance_id:${random.value}}
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://127.0.0.1:8761/eureka

greeting:
  message: Welcome to the Simple E-commerce (spring boot)

#token:
#  secret: my-very-long-secret-key-1234567890123456
#  expiration-time: 86400000 # 10 day

management:
  endpoints:
    web:
      exposure:
        include:
          - refresh
          - health
          - beans
          - info
          - busrefresh
#          - busenv


