spring:
  application:
    name: config-service
  rabbitmq:
    host: 127.0.0.1
    port: 5672
    username: guest
    password: guest
  profiles:
    active: native # 이거 안하면 기본으로 cloud.config.server.git 을 사용함.
  cloud:
    config:
      server:
        native:
          search-locations: file://${user.home}/IdeaProjects/msa-multi-project/01_reference/native-repo
        git:
          uri: file:///Users/codingtoast/IdeaProjects/git-local-repo
          default-label: main
    # RabbitMQ 4.x 대응: Spring Cloud Bus 가 익명(auto-delete/exclusive) 큐를 쓰면
    # 큐가 선언 직후 삭제되어 404(NOT_FOUND) 루프가 발생한다.
    # group 을 지정해 이름 있는 durable 큐(springCloudBus.<group>)를 쓰게 한다.
    stream:
      bindings:
        springCloudBusInput:
          group: ${spring.application.name}
server:
  port: 8888
management:
  endpoints:
    web:
      exposure:
        include:
          - refresh
          - health
          - beans
          - info
          - httpexchanges
          - busrefresh
