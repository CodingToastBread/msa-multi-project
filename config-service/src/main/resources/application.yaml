spring:
  application:
    name: config-service
  rabbitmq:
    host: 127.0.0.1
    port: 5672
    username: guest
    password: guest
  profiles:
    active: native # 이거 안하면 기본으로 cloud.config.server.git 을 사용함.
  cloud:
    config:
      server:
        native:
          search-locations: file://${user.home}/IdeaProjects/msa-multi-project/01_reference/native-repo
        git:
          uri: file:///Users/codingtoast/IdeaProjects/git-local-repo
          default-label: main
server:
  port: 8888
management:
  endpoints:
    web:
      exposure:
        include:
          - refresh
          - health
          - beans
          - info
          - httpexchanges
          - busrefresh
