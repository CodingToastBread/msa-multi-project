# Zipkin + MySQL (분산 추적 저장소)
# 실행: docker compose up -d   중지: docker compose down   완전 초기화: docker compose down && rm -rf mysql-data
#
# UI: http://localhost:9411
#
# [주의] 호스트 MySQL 포트를 3307 로 뺐다.
#        kafka-practice/docker-compose.yml 의 mariadb 가 이미 3306 을 쓰고 있어서 충돌한다.
#        컨테이너끼리는 내부 3306 으로 통신하므로 Zipkin 설정에는 영향이 없다.
services:
  zipkin:
    image: openzipkin/zipkin:3
    container_name: zipkin
    ports:
      - "9411:9411"
    environment:
      # 저장소를 지정하지 않으면 인메모리로 뜬다(= 재시작하면 trace 소멸).
      # mysql 로 지정했으므로 initdb.d 의 스키마가 반드시 먼저 만들어져 있어야 한다.
      STORAGE_TYPE: mysql
      MYSQL_HOST: mysql        # 아래 서비스명. 컨테이너 네트워크 안에서 DNS 로 해석된다
      MYSQL_TCP_PORT: 3306     # 호스트의 3307 이 아니라 컨테이너 내부 포트
      MYSQL_DB: zipkin
      MYSQL_USER: zipkin
      MYSQL_PASS: zipkin
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.0
    container_name: zipkin-mysql
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: zipkin
      MYSQL_USER: zipkin
      MYSQL_PASSWORD: zipkin
      MYSQL_ROOT_PASSWORD: root
    volumes:
      # initdb.d 는 "DB 데이터가 비어있을 때 최초 1회만" 실행된다.
      # 스키마를 고쳤다면 mysql-data 를 지우고 다시 올려야 반영된다.
      - ./initdb.d:/docker-entrypoint-initdb.d
      - ./mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uzipkin", "-pzipkin"]
      interval: 10s
      timeout: 5s
      retries: 10
