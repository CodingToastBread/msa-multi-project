spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    username: sa
    password: '{cipher}'
  # devtools 가 enabled=true 는 자동으로 켜주지만 web-allow-others 는 안 켜준다.
  # => 127.0.0.1 이 아닌 주소(LAN IP 등)로 접속하면 'webAllowOthers' 에러가 난다.
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true

order-service:
#  url: http://127.0.0.1:8000/order-service/%s/orders
  # User-Service 에서 @LoadBalanced 애노테이션을 RestTemplate 에 부여했기 때문에 order-service 라는 부분을
  # Eureka 서버에서 정확한 IP 와 Port 로 바꿔치기 해서 전달된다.
  url: http://order-service/order-service/%s/orders
  exception:
    order-is-empty: "User's orders is empty"